# Runs in the cloud on GitHub: fetches news every 30 minutes, commits it,
# and publishes the site/ folder to GitHub Pages. Your computer can be off.
name: Update news

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Both rewrite providers, so switching "provider" in config/ai.json is a one-word
      # edit with no workflow change.
      - name: Install the rewrite SDKs
        run: pip install --quiet google-genai anthropic

      # Guards the rule the whole site rests on: no publisher's words or name reaches
      # a reader. Runs offline against a stubbed rewrite, so it costs nothing.
      - name: Check the publishing rules
        run: python scripts/selftest.py

      # Every story is rewritten in Tamil before it is published, so without a key for
      # whichever provider config/ai.json names, no new story can go live. Stop here so
      # the run goes red and GitHub emails about it; Pages keeps serving the last
      # deployment, so the site stays up meanwhile.
      - name: Check the rewrite provider has its key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/ai_enrich.py --check --no-build || {
            echo "::error title=No API key for the rewrite provider::Stories are rewritten in Tamil before publication, so no new story can go live and the site will keep serving its current pages. GEMINI_API_KEY is free from https://aistudio.google.com/apikey — add it under Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          }

      - name: Fetch news, write it in Tamil and build the site
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch_news.py

      - name: Make today's share card
        run: python scripts/make_card.py --skip-existing || echo "card skipped"

      - name: Save fetched news
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data site
          git diff --cached --quiet || (git commit -m "Auto-update news" && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
