# Runs in the cloud on GitHub: fetches news every 30 minutes, commits it,
# and publishes the site/ folder to GitHub Pages. Your computer can be off.
name: Update news

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Anthropic SDK (for the Tamil rewrite)
        run: pip install --quiet anthropic

      # Every story is rewritten in Tamil before it is published, so without this secret
      # no new story can go live. Stop here so the run goes red and GitHub emails about
      # it; Pages keeps serving the last deployment, so the site stays up meanwhile.
      - name: Check the Anthropic API key is configured
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error title=ANTHROPIC_API_KEY is not set::Stories are rewritten in Tamil by Claude before publication, so no new story can go live and the site will keep serving its current pages. Add the key under Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi
          echo "Anthropic API key found."

      - name: Fetch news, write it in Tamil and build the site
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch_news.py

      - name: Make today's share card
        run: python scripts/make_card.py --skip-existing || echo "card skipped"

      - name: Save fetched news
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data site
          git diff --cached --quiet || (git commit -m "Auto-update news" && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
