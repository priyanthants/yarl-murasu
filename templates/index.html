<!doctype html>
<html lang="ta">
<head>
{{head}}
</head>
<body data-base="" data-page="home">
{{header}}

<main id="content" class="wrap">
  <section class="hero" id="hero" aria-label="முதன்மைச் செய்திகள்">{{home_hero}}</section>

  <div class="layout">
    <div class="main-col">
      <div class="section-head">
        <h2 class="section-title" id="list-title">சமீபத்திய செய்திகள்</h2>
        <span class="section-count" id="list-count" aria-live="polite">{{home_count}}</span>
      </div>
      <div class="chips" id="chips" role="group" aria-label="செய்திப் பிரிவுகள்">{{home_chips}}</div>
      <noscript><p class="notice">தேடல் மற்றும் பிரிவு வடிகட்டலுக்கு JavaScript தேவை. சமீபத்திய செய்திகள் கீழே தொடர்ந்து காணப்படும்.</p></noscript>
      <div class="grid" id="news-grid">{{home_grid}}</div>
      <p class="empty" id="empty" hidden>இந்தப் பிரிவில் தற்போது செய்திகள் இல்லை.</p>
      <div class="more-wrap"><button class="btn btn-outline" id="load-more" type="button" hidden>மேலும் செய்திகள்</button></div>
    </div>

    <aside class="side-col">
      <div class="ad-slot ad-side" data-ad-slot="sidebar"></div>
      <section class="widget">
        <h3 class="widget-title">சற்று முன்</h3>
        <ol class="rank-list" id="latest-list">{{home_latest}}</ol>
      </section>
      <section class="widget">
        <h3 class="widget-title">பிரிவுகள்</h3>
        <div class="section-counts" id="section-counts"></div>
      </section>
    </aside>
  </div>

  <section class="band video-band" id="video-band" hidden>
    <div class="section-head">
      <h2 class="section-title"><svg class="i"><use href="#i-play"/></svg> காணொளிகள்</h2>
    </div>
    <div class="video-row" id="video-row"></div>
  </section>

  <div id="cat-blocks"></div>

  <section class="band photo-band" id="photo-band" hidden>
    <div class="section-head">
      <h2 class="section-title"><svg class="i"><use href="#i-camera"/></svg> புகைப்படத் தொகுப்பு</h2>
    </div>
    <div class="photo-grid" id="photo-grid"></div>
  </section>
</main>

{{footer}}
</body>
</html>
